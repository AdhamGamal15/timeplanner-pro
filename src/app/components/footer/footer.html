<div class="footer-brand">
  <i class="pi pi-calendar-clock footer-logo"></i>
  <div class="footer-text">
    <span class="footer-title">TimePlanner Pro</span>
    <span class="footer-meta">
      &copy; {{ year }} All rights reserved &middot; Browser language: {{ browserLanguage }}
    </span>
  </div>
</div>

<div class="footer-socials">
  @for (social of socials; track social.label) {
    <a
      class="footer-social"
      [href]="social.url"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="social.label"
      [attr.title]="social.label"
    >
      <i class="pi" [class]="social.icon"></i>
    </a>
  }
</div>
