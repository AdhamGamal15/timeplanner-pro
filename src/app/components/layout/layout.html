<div class="d-flex flex-column min-vh-100">
  <app-navbar />
  <main class="flex-grow-1">
    @if (loadingAbout()) {
      <div class="container text-center py-5">
        <div class="spinner-border text-primary mb-3" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-secondary">Loading About page...</p>
      </div>
    }
    <!-- Hidden (not destroyed) while loading so the current page keeps its state -->
    <div [class.d-none]="loadingAbout()">
      <router-outlet />
    </div>
  </main>
  <app-footer />
</div>
